services:
  web:
    build: .
    ports:
      - "9001:8000"
    restart: unless-stopped
    volumes:
      # Persist SQLite + allow editing seed CSVs on the host
      - ./data:/app/data
    environment:
      INVENTORY_DB: /app/data/inventory.db
    # Auto-seed runs on startup when DB is empty (see app/main.py lifespan)
